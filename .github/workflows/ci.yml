name: CI

on:
  push:
  pull_request:

env:
  CHEFOS_MASTER_KEY: Y2ktbWFzdGVyLWtleS0wMTIzNDU2Nzg5YWJjZGVmZ2g=  # CI only (32 bytes, base64)
  CHEFOS_MASTER_KEY_ID: ci-1
  ENV: test
  OTEL_ENABLED: "false"
  TEST_DB_HOST: localhost:5432

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://chefos_app:chefos_app@localhost:5432/chefos
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://chefos_owner:chefos_owner@localhost:5432/chefos
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Initialise roles and databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f ../../infra/postgres/init.sql
      - run: uv run alembic upgrade head
      - run: uv run pytest -q

  migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s
          --health-retries 20
    env:
      MIGRATIONS_DATABASE_URL: postgresql+asyncpg://chefos_owner:chefos_owner@localhost:5432/chefos
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
      - run: uv sync --frozen
      - name: Initialise roles and databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f ../../infra/postgres/init.sql
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      - name: Models match migrations
        run: uv run alembic check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  smoke:
    runs-on: ubuntu-latest
    needs: [api]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
      - name: Bring the stack up and run the smoke test
        run: make smoke
      - name: Compose logs on failure
        if: failure()
        run: docker compose --env-file .env -f infra/docker-compose.yml logs --tail=200
